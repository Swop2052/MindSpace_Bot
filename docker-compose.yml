version: '3.8'

services:
  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    image: mindspace-conversational-bot
    container_name: mindspace-conversational-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - API_HOST=0.0.0.0
      - API_PORT=8015
      - API_RELOAD=False
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - USE_REDIS=True
      - MEMORY_FILE_PATH=/app/data/conversation_memory.json
    volumes:
      - chatbot-data:/app/data
    networks:
      - mindspace-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8015/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
        reservations:
          memory: 256M

  redis:
    image: redis:alpine
    container_name: mindspace-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - mindspace-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  chatbot-data:
  redis-data:

networks:
  mindspace-network:
    driver: bridge