version: '3.8'

services:
  mindspace-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mindspace-chatbot
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_RELOAD=False
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
      - MEMORY_FILE_PATH=/app/data/conversation_memory.json
    volumes:
      - ./data:/app/data
    networks:
      - mindspace-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

networks:
  mindspace-network:
    driver: bridge